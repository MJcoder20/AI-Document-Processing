services:
  # FastAPI backend
  - type: web
    name: docuflow-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health/live

    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10

      - key: APP_ENV
        value: production

      - key: DEBUG
        value: "false"

      - key: JWT_ALGORITHM
        value: HS256

      - key: JWT_SECRET_KEY
        generateValue: true

      - key: DATABASE_URL
        sync: false

      - key: CORS_ORIGINS
        sync: false

      - key: ALLOWED_HOSTS
        sync: false

      - key: AI_PROVIDER
        value: mock

      - key: PROCESSING_MODE
        value: inline

      - key: DOCUMENT_STORAGE_DIR
        value: storage/documents

  # React frontend
  - type: web
    name: docuflow-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist

    envVars:
      - key: VITE_API_URL
        sync: false
